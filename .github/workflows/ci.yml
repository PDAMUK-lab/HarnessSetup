name: ci
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck jq python3-yaml
          shellcheck --version | head -2
          pwsh --version
      - name: Tests
        run: STRICT=1 bash tests/run-tests.sh
  windows-powershell:
    # The desktop scripts run in Windows PowerShell 5.1, the one every Windows has; the job above has pwsh 7 only, and 5.1
    # differs (its ConvertFrom-Json writes a JSON array as ONE object; no ?? or ternary). Parse every script with 5.1's
    # parser and run the helper and settings unit tests in it, on LF files as in the release zip.
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSEdition -ne 'Desktop') { throw "not Windows PowerShell: $($PSVersionTable.PSVersion)" }
          Write-Host "Windows PowerShell $($PSVersionTable.PSVersion)"
          $root = $PWD.Path; $tmp = Join-Path $env:RUNNER_TEMP 'hs'; New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $failed = @()
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests\powershell\Parse-All.ps1 "$root\desktop,$root\tests\powershell"
          if ($LASTEXITCODE) { $failed += 'parse' }
          $port = Get-Random -Minimum 20000 -Maximum 40000
          $env:FAKE_TOOL_PORT = $port; $env:FAKE_PROSE_PORT = $port + 1; $env:FAKE_KEY_PORT = $port + 2; $env:FAKE_GITHUB_PORT = $port + 3
          $env:FAKE_GITHUB_LOG = Join-Path $tmp 'github.log'; New-Item -ItemType File -Force -Path $env:FAKE_GITHUB_LOG | Out-Null
          $servers = @(
              Start-Process python -ArgumentList "tests\fakebin\fake_llm.py $port tool" -NoNewWindow -PassThru
              Start-Process python -ArgumentList "tests\fakebin\fake_llm.py $($port + 1) prose" -NoNewWindow -PassThru
              Start-Process python -ArgumentList "tests\fakebin\fake_llm.py $($port + 2) tool secret" -NoNewWindow -PassThru
              Start-Process python -ArgumentList "tests\fakebin\fake_github.py $($port + 3) $env:FAKE_GITHUB_LOG" -NoNewWindow -PassThru)
          Start-Sleep -Seconds 2
          try {
              powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests\powershell\Test-Common.ps1 -Root $root -Tmp $tmp
              if ($LASTEXITCODE) { $failed += 'helpers' }
              powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests\powershell\Test-Settings.ps1 -Root $root -Tmp $tmp
              if ($LASTEXITCODE) { $failed += 'settings' }
          } finally { $servers | Stop-Process -Force -ErrorAction SilentlyContinue }
          if ($failed) { throw "failed in Windows PowerShell 5.1: $($failed -join ', ')" }
